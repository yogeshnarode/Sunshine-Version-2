workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle

    scripts:
      - name: Flutter Doctor
        script: |
          flutter doctor

      - name: Get Dependencies
        script: |
          flutter pub get

      - name: Build APK (Release)
        script: |
          flutter build apk --release

      # OPTIONAL: Build App Bundle (AAB)
      # - name: Build AAB
      #   script: |
      #     flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - yogesh.narode@conmove.io
